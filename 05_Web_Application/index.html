</style></head><body><div id="scrollProgress" aria-hidden="true"></div><div id="cursorAura" aria-hidden="true"></div><div class="layout"><aside class="side"><div class="brand"><div class="logo">S</div><span class="brandname">StudyVault</span></div><div class="caption">Workspace</div><div class="nav active" data-page="dashboard"><span class="ico">◫</span><span>Dashboard</span></div><div class="nav" data-page="subjects"><span class="ico">▦</span><span>Subject library</span></div><div class="nav" data-page="pyqs"><span class="ico">▤</span><span>PYQ explorer</span></div><div class="nav" data-page="timetable"><span class="ico">◷</span><span>Timetable</span></div><div class="caption">Library</div><div class="nav" data-page="manage"><span class="ico">⌘</span><span>Manage files</span></div><div class="sidefoot">LOCAL LIBRARY · CSE<br>Files stay on this device</div></aside><main class="main"><header class="top"><div class="crumb">Workspace　/　<span id="crumb">Dashboard</span></div><div class="topright"><label class="search">⌕ <input id="search" placeholder="Search subjects and files…"><kbd style="color:#687582;font-size:9px">/</kbd></label><div class="profile">C</div></div></header><div id="page"></div></main></div><div id="modal" class="modal"><div class="modalhead"><span id="modalname">Document</span><button class="close" onclick="closePdf()">×</button></div><iframe id="pdf"></iframe></div><script>
const $=s=>document.querySelector(s);let subjects=[],docs=[],exams=[],current='dashboard';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async p=>(await fetch('/api/'+p)).json();function dateparts(s){let d=new Date(s+'T12:00:00');return [d.toLocaleDateString('en',{month:'short'}).toUpperCase(),d.getDate(),d.toLocaleDateString('en',{weekday:'short'})]};function fileURL(d,download=false){return '/files/'+d.path.split('/').map(encodeURIComponent).join('/')+(download?'?download=1':'')};function pdf(d){$('#modalname').textContent=d.name;$('#pdf').src=d.ext==='.pptx'?'/preview/'+d.path.split('/').map(encodeURIComponent).join('/'):fileURL(d);$('#modal').classList.add('opened')}function closePdf(){$('#pdf').src='';$('#modal').classList.remove('opened')}function size(n){return n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1024)+' KB'}function tile(s){let c=s.counts||{};return `<article class="subject" onclick="openSubject('${esc(s.name)}')"><div class="subrow"><span class="badge">CSE · SEM V</span><span style="color:#71808d">↗</span></div><h3>${esc(s.name)}</h3><p>Study materials and exam resources</p><div class="counts"><span>${c.Module||0} modules</span><span>${c.PYQ||0} PYQs</span><span>${c['Mid-semester']||0} mid-sem</span></div></article>`}function examCard(e){let [m,d,w]=dateparts(e.date);return `<div class="exam"><div class="datebox"><small>${m}</small>${d}<small>${w}</small></div><div><div class="examname">${esc(e.name)}</div><div class="exammeta">${e.code?esc(e.code)+' · ':''}${e.time||'Time not shown in timetable'}</div></div><span class="tag">${e.verified?'Scheduled':'Confirm elective'}</span></div>`}function docRow(d){return `<div class="docrow"><div><div class="docname">${esc(d.name)}</div><div class="docmeta">${esc(d.subject||d.category)} · ${d.pages?d.pages+' pages · ':''}${size(d.size)}</div></div><div class="doc-actions"><button class="open" onclick='pdf(${JSON.stringify(d).replace(/'/g,'&#39;')})'>Preview</button><a class="download-icon" href="${fileURL(d,true)}" download title="Download ${esc(d.name)}" aria-label="Download ${esc(d.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg></a></div></div>`}async function refresh(){[subjects,docs,exams]=await Promise.all([api('subjects'),api('documents'),api('exams')]);render()}function setpage(p){current=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',subjects:'Subject library',pyqs:'PYQ explorer',timetable:'Timetable',manage:'Manage files'})[p];render()}function render(){let el=$('#page');el.classList.remove('route-enter');void el.offsetWidth;el.classList.add('route-enter');if(current==='dashboard'){let today=new Date('2026-11-27T12:00:00');let upcoming=exams.find(e=>new Date(e.date+'T23:59:00')>=today);let days=upcoming?Math.ceil((new Date(upcoming.date+'T12:00:00')-today)/86400000):'—';let modules=docs.filter(d=>d.category==='Module').length,pyqs=docs.filter(d=>d.category==='PYQ').length,mid=docs.filter(d=>d.category==='Mid-semester').length;el.innerHTML=`<div class="hero"><div><div class="eyebrow">Friday · November 27, 2026</div><h1 class="headline">Your semester, in focus.</h1><div class="sub">A clear view of your CSE study library and exam runway.</div></div><div class="orb-wrap"><div class="orb" aria-hidden="true"><div class="orb-ring"></div><div class="orb-ring r2"></div><div class="orb-dot"></div><div class="orb-core"></div></div><div class="orb-label">Your focus<strong>CSE · Semester V</strong></div></div></div><div class="metrics"><div class="metric"><div class="label">Subjects</div><div class="value">${subjects.length}</div><div class="hint">Across your library</div></div><div class="metric"><div class="label">Modules</div><div class="value">${modules}</div><div class="hint">Readings and lecture decks</div></div><div class="metric"><div class="label">PYQ papers</div><div class="value">${pyqs}</div><div class="hint">Split from combined archive</div></div><div class="metric"><div class="label">Next examination</div><div class="value" style="font-size:19px">${days} days</div><div class="hint">${upcoming?esc(upcoming.name):'No upcoming exam'}</div></div></div><section class="section"><div class="sectionhead"><h2>Your subjects</h2><button class="link" onclick="setpage('subjects')">View all →</button></div><div class="grid">${subjects.slice(0,6).map(tile).join('')}</div></section><div class="columns section"><section class="card"><div class="sectionhead"><h2>Upcoming examinations</h2><button class="link" onclick="setpage('timetable')">Full timetable →</button></div>${exams.slice(0,4).map(examCard).join('')}</section><section class="card"><div class="sectionhead"><h2>Recently added</h2></div>${docs.slice(0,5).map(docRow).join('')||'<div class="empty">No documents found.</div>'}</section></div><div class="notice">Timetable image contains dates and subjects only. Exam times are not provided.</div>`}
if(current==='subjects'){el.innerHTML=`<div class="eyebrow">Your CSE workspace</div><h1 class="headline">Subject library</h1><p class="sub">One home for modules, question papers and semester notes.</p><div class="grid section">${subjects.map(tile).join('')}</div>`}
if(current==='subject'){let s=subjects.find(x=>x.name===window.selectedSubject);let d=docs.filter(x=>x.subject===window.selectedSubject);el.innerHTML=`<button class="link" onclick="setpage('subjects')">← All subjects</button><h1 class="headline" style="margin-top:15px">${esc(window.selectedSubject)}</h1><div class="toolbar"><button class="pill active" onclick="filterDocs('all',this)">All</button><button class="pill" onclick="filterDocs('Module',this)">Modules</button><button class="pill" onclick="filterDocs('PYQ',this)">PYQs</button><button class="pill" onclick="filterDocs('Mid-semester',this)">Mid-sem</button><button class="pill" onclick="filterDocs('Other material',this)">Other</button></div><div class="list" id="subjectdocs">${d.map(doc=>`<div data-cat="${esc(doc.category)}">${docRow(doc)}</div>`).join('')||'<div class="empty">No files in this subject yet. Add files to its folder, then rescan. Mid-sem papers can go in Mid_Sem/.</div>'}</div>`}
if(current==='pyqs'){let ps=docs.filter(d=>d.category==='PYQ');let names=[...new Set(ps.map(d=>d.subject))];el.innerHTML=`<div class="eyebrow">Past papers</div><h1 class="headline">PYQ explorer</h1><p class="sub">Filter across ${ps.length} individual papers split from the combined archive.</p><div class="toolbar"><button class="pill active" onclick="filterPyq('all',this)">All subjects</button>${names.map(n=>`<button class="pill" onclick="filterPyq('${esc(n)}',this)">${esc(n)}</button>`).join('')}</div><div class="list" id="pyqlist">${ps.map(d=>`<div data-sub="${esc(d.subject)}">${docRow(d)}</div>`).join('')}</div>`}
if(current==='timetable'){el.innerHTML=`<div class="eyebrow">December 2026</div><h1 class="headline">Examination timetable</h1><p class="sub">Dates transcribed from your uploaded CSE timetable image.</p><div class="notice">Start times, end times and duration are absent from the source image.</div><section class="card section">${exams.map(examCard).join('')}</section>`}
if(current==='manage'){Promise.all([api('library/status'),api('library/duplicates')]).then(([x,dups])=>{if(current!=='manage')return;$('#status').innerHTML=`<div class="metrics"><div class="metric"><div class="label">Indexed files</div><div class="value">${x.documents}</div></div><div class="metric"><div class="label">Missing files</div><div class="value">${x.missing}</div></div><div class="metric"><div class="label">Review items</div><div class="value">${x.review}</div></div><div class="metric"><div class="label">Duplicate groups</div><div class="value">${dups.length}</div></div></div>`});let review=docs.filter(d=>d.category==='Review');el.innerHTML=`<div class="eyebrow">Library management</div><h1 class="headline">Manage your library</h1><p class="sub">Add new files to their subject folders. Rescan to update the index.</p><div id="status"></div><button class="pill active" onclick="rescan(this)">↻　Rescan library</button><div id="scanmsg" style="display:inline-block;margin-left:10px;color:#8e9aa7"></div><section class="section card"><div class="sectionhead"><h2>Folder locations</h2></div><p class="sub">Subject folders live in 01_Subjects. Drop mid-semester PDFs into each subject’s Mid_Sem folder. Unrecognized files added to 03_Unclassified are listed for review.</p></section><section class="section"><div class="sectionhead"><h2>Needs review</h2></div><div class="list">${review.map(docRow).join('')||'<div class="empty">No unclassified files.</div>'}</div></section>`}}
let revealObserver=null;function animateCounters(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('#page .metric .value').forEach(el=>{const m=el.textContent.trim().match(/^(\d+)(.*)$/);if(!m)return;const target=Number(m[1]),suffix=m[2];if(target===0){el.textContent='0'+suffix;return}const start=performance.now(),duration=760;function tick(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);el.textContent=Math.round(target*ease)+suffix;if(t<1)requestAnimationFrame(tick)}el.textContent='0'+suffix;requestAnimationFrame(tick)})}function revealOnScroll(){if(revealObserver)revealObserver.disconnect();const items=document.querySelectorAll('#page > .hero,#page > .headline,#page > .sub,#page > .toolbar,#page > .notice,#page > .grid > .subject,#page > .list > div,#page .exam,#page .docrow,#page .file,#page > .section > .sectionhead,#page > .columns > .card');if(!('IntersectionObserver'in window)){items.forEach(x=>x.classList.add('scroll-shown'));return}revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('scroll-shown');revealObserver.unobserve(entry.target)}}),{threshold:.08,rootMargin:'0px 0px -36px 0px'});items.forEach(x=>{x.classList.add('scroll-rise');revealObserver.observe(x)})}const baseRender=render;render=function(){baseRender();requestAnimationFrame(()=>{animateCounters();revealOnScroll();updateScrollProgress()})};function updateScrollProgress(){const max=document.documentElement.scrollHeight-innerHeight,p=max>0?scrollY/max:0;$('#scrollProgress').style.transform=`scaleX(${Math.max(0,Math.min(1,p))})`;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,mobile=matchMedia('(max-width:700px)').matches;if(!mobile){const depth=reduced?0:-Math.min(scrollY*.07,90);document.documentElement.style.setProperty('--hero-parallax',depth+'px')}}let scrollFrame=0;addEventListener('scroll',()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{updateScrollProgress();scrollFrame=0})},{passive:true});addEventListener('resize',updateScrollProgress);function openSubject(n){window.selectedSubject=n;setpage('subject')}function filterDocs(cat,b){document.querySelectorAll('.toolbar .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#subjectdocs>[data-cat]').forEach(x=>x.style.display=cat==='all'||x.dataset.cat===cat?'':'none')}function filterPyq(s,b){document.querySelectorAll('.toolbar .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#pyqlist>[data-sub]').forEach(x=>x.style.display=s==='all'||x.dataset.sub===s?'':'none')}async function rescan(b){b.disabled=true;$('#scanmsg').textContent='Scanning local files…';let r=await fetch('/api/library/rescan',{method:'POST'});let x=await r.json();$('#scanmsg').textContent=`Done · ${x.files_scanned} files indexed`;await refresh();setpage('manage')}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setpage(n.dataset.page));$('#search').oninput=async e=>{let q=e.target.value;if(q.length<2){if(current==='search')setpage('dashboard');return}current='search';$('#crumb').textContent='Search';let r=await api('search?q='+encodeURIComponent(q));$('#page').innerHTML=`<div class="eyebrow">Search results</div><h1 class="headline">${r.length} matches</h1><div class="list section">${r.map(docRow).join('')||'<div class="empty">No matches.</div>'}</div>`};document.onkeydown=e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#search').focus()}if(e.key==='Escape')closePdf()};refresh();
const aura=$('#cursorAura');let auraX=-500,auraY=-500,raf=0;document.addEventListener('pointermove',e=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches||e.pointerType==='touch')return;auraX=e.clientX;auraY=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{aura.style.left=auraX+'px';aura.style.top=auraY+'px';raf=0});const card=e.target.closest('.subject,.metric,.card,.file');if(card){const r=card.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));card.style.setProperty('--mx',(x*100)+'%');card.style.setProperty('--my',(y*100)+'%');if(matchMedia('(hover:hover)').matches){const force=card.matches('.card,.file')?1.5:4.2;card.style.transform=`perspective(1100px) rotateX(${(0.5-y)*force}deg) rotateY(${(x-0.5)*force}deg) translateY(-3px) scale(1.006)`}}});document.addEventListener('pointerout',e=>{const card=e.target.closest('.subject,.metric,.card,.file');if(card&&!card.contains(e.relatedTarget))card.style.transform=''});
// Delegated magnetic response keeps one listener for all present and future controls.
const magneticQuery='button,.nav,.open,.pill,.download-icon,.close';let magneticFrame=0,magneticTarget=null;document.addEventListener('pointermove',e=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;const el=e.target.closest(magneticQuery);if(magneticTarget&&magneticTarget!==el)magneticTarget.style.translate='';magneticTarget=el;if(!el)return;if(!magneticFrame)magneticFrame=requestAnimationFrame(()=>{if(!magneticTarget){magneticFrame=0;return}const r=magneticTarget.getBoundingClientRect(),strength=magneticTarget.matches('.nav')?3:5;magneticTarget.style.translate=`${(auraX-(r.left+r.width/2))/r.width*strength}px ${(auraY-(r.top+r.height/2))/r.height*strength}px`;magneticFrame=0})},{passive:true});document.addEventListener('pointerout',e=>{const el=e.target.closest(magneticQuery);if(el&&!el.contains(e.relatedTarget)){el.style.translate='';if(magneticTarget===el)magneticTarget=null}});
// Tiny interaction sparks are short lived, delegated, and skipped for reduced motion.
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=e.target.closest('button,.nav,.open,.pill,.download-icon');if(!el)return;const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let i=0;i<4;i++){const spark=document.createElement('i');spark.className='tap-spark';spark.style.left=x+'px';spark.style.top=y+'px';const a=(i*90+45)*Math.PI/180;spark.style.setProperty('--spark-x',(Math.cos(a)*13)+'px');spark.style.setProperty('--spark-y',(Math.sin(a)*13)+'px');el.appendChild(spark);spark.addEventListener('animationend',()=>spark.remove(),{once:true})}},{passive:true});
</script></body></html>
